<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Invitation: 20 Years BEMBA</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            background-color: #eef2f3; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; overflow: hidden; 
        }

        .scale-wrapper { 
            width: 100%; height: 100vh; display: flex; justify-content: center; align-items: center; 
        }

        .card-stage { 
            perspective: 2000px; 
            width: 90vw; max-width: 800px; 
            height: 67.5vw; max-height: 600px;
            position: relative; cursor: pointer;
            transition: transform 0.8s ease-in-out; 
        }

        .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; }

        /* Türen exakt auf 50% ohne Überlappung */
        .card-door { 
            position: absolute; top: 0; width: 50%; height: 100%; 
            z-index: 2; transform-style: preserve-3d; 
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        .door-left { left: 0; transform-origin: left center; }
        .door-right { right: 0; transform-origin: right center; }

        .door-face { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            backface-visibility: hidden; 
            background-repeat: no-repeat;
            /* WICHTIG: 100.5% Breite verhindert den weißen Spalt durch Rundungsfehler */
            background-size: 100.5% 100%; 
        }

        .door-back { transform: rotateY(180deg); }

        /* --- DIE LÖSUNG FÜR DAS SEIL --- */
        /* Linke Tür: Das Bild wird ganz nach RECHTS geschoben */
        .door-left .door-front { 
            background-image: url('https://i.postimg.cc/rwB3syyL/tu-r-aussen-links.png');
            background-position: right center; 
        }
        /* Rechte Tür: Das Bild wird ganz nach LINKS geschoben */
        .door-right .door-front { 
            background-image: url('https://i.postimg.cc/Qd2wCNN3/tu-r-aussen-rechts.png');
            background-position: left center; 
        }

        /* --- ÖFFNUNGSWINKEL & RESPONSIVE --- */
        .card-stage.is-open .door-left { transform: rotateY(-120deg); }
        .card-stage.is-open .door-right { transform: rotateY(120deg); }

        @media (max-width: 768px) and (orientation: portrait) {
            .card-stage.is-open { transform: scale(0.55); }
            .card-stage.is-open .door-left { transform: rotateY(-140deg); }
            .card-stage.is-open .door-right { transform: rotateY(140deg); }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            .card-stage { height: 70vh; width: 93.3vh; }
            .card-stage.is-open { transform: scale(0.65); }
            .card-stage.is-open .door-left { transform: rotateY(-145deg); }
            .card-stage.is-open .door-right { transform: rotateY(145deg); }
        }

        /* --- INNENBILDER --- */
        .card-inside { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; 
            background-image: url('https://i.postimg.cc/yYNwrrrR/mitte.png'); 
            background-size: 100% 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3); 
        }

        .door-left .door-back { 
            background-image: url('https://i.postimg.cc/jdjGkkkd/tu-r-innen-links.png');
            background-position: right center;
        }
        .door-right .door-back { 
            background-image: url('https://i.postimg.cc/CxB9wngm/tu-r-innen-rechts.png');
            background-position: left center;
        }
    </style>
</head>
<body>
    <div class="scale-wrapper">
        <div class="card-stage" onclick="this.classList.toggle('is-open')">
            <div class="card">
                <div class="card-inside"></div>
                <div class="card-door door-left">
                    <div class="door-face door-front"></div>
                    <div class="door-face door-back"></div>
                </div>
                <div class="card-door door-right">
                    <div class="door-face door-front"></div>
                    <div class="door-face door-back"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
